---
name: Security

on: # yamllint disable-line rule:truthy
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      security-type:
        description: What Security scanning you would like to run?
        required: false
        default: "all"
        type: choice
        options: ["all", "sca", "code-scanning", "pnpm-audit"]

defaults:
  run:
    shell: sh

jobs:
  sast:
    name: SAST
    uses: fabasoad/reusable-workflows/.github/workflows/wf-security-sast.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      code-scanning-languages: "actions, javascript"
      code-scanning: ${{ contains(fromJSON('["all", "code-scanning"]'), github.event.inputs.security-type || 'all') }}
      sca: ${{ contains(fromJSON('["all", "sca"]'), github.event.inputs.security-type || 'all') }}
  pnpm-audit:
    name: pnpm audit
    if: contains(fromJSON('["all", "pnpm-audit"]'), github.event.inputs.security-type || 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: "true"
      - name: pnpm audit
        run: pnpm audit
